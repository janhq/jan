[package]
name = "jan-cli"
version = "0.8.4"
description = "Headless CLI for Jan: chat with remote AI models in an interactive agent console."
authors = ["Jan <service@jan.ai>"]
license = "MIT"
repository = "https://github.com/janhq/jan"
edition = "2021"
rust-version = "1.85"

# Split out of the desktop crate so the Tauri bundler never enumerates it as a
# bin target of the app (tauri-cli ignores required-features and would try to
# copy a `jan` binary the desktop build never produces). Shares the workspace
# target dir, so `target/release/jan` is unchanged.
[[bin]]
name = "jan"
path = "src/main.rs"

[features]
cli = ["app_lib/cli"]

[dependencies]
app_lib = { path = "..", package = "Jan", default-features = false }
tauri-plugin-agent-tools = { path = "../plugins/tauri-plugin-agent-tools", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
console = "0.15"
env_logger = "0.11"
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
