permissions = [
    "allow-workspace-path",
    "allow-thread-workspace-path",
    "allow-thread-workspace-delete",
    "allow-thread-workspace-sweep",
    "allow-session-workspace-path",
    "allow-session-workspace-delete",
    "allow-session-workspace-sweep",
    "allow-skill-list",
    "allow-skill-read",
    "allow-skill-write",
    "allow-skill-delete",
    "allow-memory-list",
    "allow-memory-read",
    "allow-memory-write",
    "allow-memory-catalog",
    "allow-memory-delete",
    "allow-tool-schemas",
    "allow-sandbox-status",
    "allow-subagent-result-reserve",
    "allow-subagent-result-fill",
    "allow-attachment-import",
    "allow-execute-tool",
