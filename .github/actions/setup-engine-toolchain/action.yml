name: Setup engine toolchain
description: >
  Selects a JAN_ENGINE_VARIANT and asserts the runner can build it. The engine
  jobs run on self-hosted runners whose images carry cmake, ccache and the
  vendor toolkits, so this installs nothing -- it points ccache at the runner's
  persistent cache and fails fast when the image cannot produce the variant it
  was handed.

inputs:
  variant:
    description: >
      JAN_ENGINE_VARIANT to build: a `-` joined backend list, e.g. vulkan,
      cuda13-vulkan, rocm-vulkan, metal or cpu.
    required: true
  ccache-max:
    description: >
      ccache size limit. 25G rather than the 5G default because CUDA objects are
      large and a smaller cache thrashes instead of rolling over.
    required: false
    default: '25G'

runs:
  using: composite
  steps:
    - name: Select the engine variant
      shell: bash
      run: echo "JAN_ENGINE_VARIANT=${{ inputs.variant }}" >> "$GITHUB_ENV"

    # The cache lives outside the workspace, which is re-cloned per run. Nothing
    # is saved or restored through actions/cache: the runner's disk persists, so
    # a hit costs no upload and survives across workflows.
    - name: Point ccache at the runner's persistent cache
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "CCACHE_DIR=${LOCALAPPDATA}\\ccache" >> "$GITHUB_ENV"
        else
          echo "CCACHE_DIR=${HOME}/.ccache" >> "$GITHUB_ENV"
        fi
        echo "CCACHE_MAXSIZE=${{ inputs.ccache-max }}" >> "$GITHUB_ENV"

    # Asserts the image, not the steps above: a mis-provisioned runner fails
    # here in seconds instead of five minutes into `make build`.
    - name: Verify the toolchain
      shell: bash
      run: make check-engine-toolchain
