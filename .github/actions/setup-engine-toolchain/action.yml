name: Setup engine toolchain
description: >
  Selects a JAN_ENGINE_VARIANT and asserts the runner can build it. Every step
  is guarded on the tool, not the runner label: what the image already carries
  is left alone, the Vulkan SDK and the CUDA toolkit are fetched when absent,
  and a runner that cannot produce the variant it was handed fails fast.

inputs:
  variant:
    description: >
      JAN_ENGINE_VARIANT to build: a `-` joined backend list, e.g. vulkan,
      cuda13-vulkan, rocm-vulkan, metal or cpu.
    required: true
  ccache-max:
    description: >
      ccache size limit on self-hosted runners. 25G rather than the 5G default
      because CUDA objects are large and a smaller cache thrashes instead of
      rolling over. GitHub-hosted runners are capped at 2G, the actions/cache
      upload budget for a Vulkan plus CPU-variant build.
    required: false
    default: '25G'

runs:
  using: composite
  steps:
    - name: Select the engine variant
      shell: bash
      run: echo "JAN_ENGINE_VARIANT=${{ inputs.variant }}" >> "$GITHUB_ENV"

    # Outside the workspace, which is re-cloned per run. NOHASHDIR because cmake
    # runs under cargo's hashed OUT_DIR, which would otherwise key every object.
    - name: Point ccache at the runner's persistent cache
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "CCACHE_DIR=${LOCALAPPDATA}\\ccache" >> "$GITHUB_ENV"
        else
          echo "CCACHE_DIR=${HOME}/.ccache" >> "$GITHUB_ENV"
        fi
        if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
        else
          echo "CCACHE_MAXSIZE=${{ inputs.ccache-max }}" >> "$GITHUB_ENV"
        fi
        echo "CCACHE_NOHASHDIR=1" >> "$GITHUB_ENV"

    # GitHub-hosted images have no ccache and no persistent disk.
    - name: Install ccache
      if: runner.environment == 'github-hosted'
      shell: bash
      run: |
        if command -v ccache >/dev/null 2>&1; then
          echo "engine toolchain: ccache already on the image"
          exit 0
        fi
        case "$RUNNER_OS" in
        Linux)   sudo apt-get update && sudo apt-get install -y ccache ;;
        macOS)   brew install ccache ;;
        Windows) choco install ccache -y --no-progress ;;
        esac

    # build.rs holds the llama.cpp pin and cmake flags, so the cache is rebuilt
    # when they change and an exact hit saves nothing; a per-commit key would
    # upload on every run and churn the repo's 10 GB quota.
    - name: Restore the ccache directory
      if: runner.environment == 'github-hosted'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-${{ inputs.variant }}-${{ hashFiles('src-tauri/plugins/tauri-plugin-llamacpp/build.rs') }}
        restore-keys: ccache-${{ runner.os }}-${{ inputs.variant }}-

    # No GitHub-hosted image ships a Vulkan shader compiler, and the desktop
    # templates default to the vulkan variant on one. Guarded on glslc rather
    # than on the runner label so a self-hosted image that carries the SDK does
    # no apt or installer work at all.
    - name: Provision the Vulkan SDK
      if: contains(format('-{0}-', inputs.variant), '-vulkan-')
      shell: bash
      run: |
        if command -v glslc >/dev/null 2>&1; then
          echo "engine toolchain: glslc already on the image"
          exit 0
        fi
        case "$RUNNER_OS" in
        Linux)
          # LunarG rather than the distro packages: jammy ships Vulkan headers
          # 1.3.204, older than the extensions ggml-vulkan compiles against.
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO "/etc/apt/sources.list.d/lunarg-vulkan-$codename.list" \
            "https://packages.lunarg.com/vulkan/lunarg-vulkan-$codename.list"
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
          ;;
        Windows)
          # A persistent runner keeps the last run's install, and the installer
          # refuses to install over it.
          if [ -x /c/VulkanSDK/Bin/glslc.exe ]; then
            echo "engine toolchain: reusing the Vulkan SDK in C:\VulkanSDK"
          else
            curl -fL -o "$RUNNER_TEMP/vulkan-sdk.exe" \
              https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe
            "$RUNNER_TEMP/vulkan-sdk.exe" --root 'C:\VulkanSDK' \
              --accept-licenses --default-answer --confirm-command install
          fi
          echo 'VULKAN_SDK=C:\VulkanSDK' >> "$GITHUB_ENV"
          echo 'C:\VulkanSDK\Bin' >> "$GITHUB_PATH"
          ;;
        *)
          echo "error: no Vulkan SDK provisioning for $RUNNER_OS" >&2
          exit 1
          ;;
        esac

    # For the CUDA manifest below.
    - name: Install jq
      if: contains(inputs.variant, 'cuda') && runner.environment == 'github-hosted'
      uses: dcarbone/install-jq-action@b7ef57d46ece78760b4019dbc4080a1ba2a40b45 # v3.2.0

    # Redist archives, not the vendor installer: 1.1 GB of compiler, runtime
    # and cuBLAS against 3-4 GB that is mostly display driver and Nsight.
    - name: Provision the CUDA toolkit
      if: contains(inputs.variant, 'cuda')
      shell: bash
      run: |
        set -euo pipefail
        if command -v nvcc >/dev/null 2>&1; then
          echo "engine toolchain: nvcc already on the image"
          exit 0
        fi

        major=""
        for token in ${VARIANT//-/ }; do
          case "$token" in cuda*) major="${token#cuda}" ;; esac
        done
        # Pinned: the redist tree has no "latest" alias. Add a line per major.
        # 13.2 is the floor on Windows, not a preference: windows-2025 resolves
        # to the vs2026 image, and crt/host_config.h rejects _MSC_VER >= 1950
        # until then.
        case "$major" in
        13) release='13.2.2' ;;
        12) release='12.4.1' ;;
        *)
          echo "error: no pinned CUDA redist release for cuda$major" >&2
          echo "       add one to $(basename "$GITHUB_ACTION_PATH")/action.yml, or run this" >&2
          echo "       variant on a self-hosted runner whose image carries the toolkit" >&2
          exit 1
          ;;
        esac

        case "$RUNNER_OS" in
        Linux)
          platform='linux-x86_64'
          root="$HOME/cuda-$release"
          root_native="$root"
          ;;
        Windows)
          platform='windows-x86_64'
          root="/c/cuda-$release"
          root_native="C:\\cuda-$release"
          ;;
        *)
          echo "error: no CUDA redist provisioning for $RUNNER_OS" >&2
          exit 1
          ;;
        esac

        # cuBLAS is the only maths library ggml links; the rest is nvcc's own
        # toolchain, the runtime, and headers ggml includes.
        packages='
          cuda_nvcc cuda_crt libnvvm libnvptxcompiler libnvjitlink libnvfatbin
          cuda_cuobjdump cuda_nvdisasm cuda_nvprune cuda_cuxxfilt cuda_nvrtc
          cuda_cudart libcublas cuda_cccl cuda_nvtx cuda_profiler_api
        '
        # These three ship inside cuda_nvcc before 12.8 and standalone after,
        # so their absence from a manifest is expected, not a broken list.
        bundled_before_12_8=' cuda_crt libnvvm libnvptxcompiler '

        base='https://developer.download.nvidia.com/compute/cuda/redist'
        manifest="$RUNNER_TEMP/redistrib.json"
        curl -fsSL -o "$manifest" "$base/redistrib_$release.json"

        # One at a time, deleted as we go: the whole set unpacked beside its
        # archives does not comfortably fit the Windows runner's disk.
        unpack() {
          case "$1" in
          *.zip)
            if command -v 7z >/dev/null 2>&1; then 7z x -y -o"$2" "$1" >/dev/null
            elif command -v unzip >/dev/null 2>&1; then unzip -q -o "$1" -d "$2"
            else echo "error: no 7z or unzip to unpack $1" >&2; return 1
            fi
            ;;
          *) tar -xf "$1" -C "$2" ;;
          esac
        }

        tmp="$RUNNER_TEMP/cuda-redist"
        rm -rf "$tmp"
        mkdir -p "$tmp" "$root"
        sw=$SECONDS
        bytes=0
        for pkg in $packages; do
          rel=$(jq -r --arg p "$pkg" --arg pl "$platform" \
            '.[$p][$pl].relative_path // empty' "$manifest")
          if [ -z "$rel" ]; then
            case "$bundled_before_12_8" in
            *" $pkg "*) echo "engine toolchain: $pkg is part of cuda_nvcc in $release"; continue ;;
            esac
            echo "error: $pkg has no $platform archive in redistrib_$release.json" >&2
            exit 1
          fi
          archive="$tmp/$(basename "$rel")"
          curl -fsSL -o "$archive" "$base/$rel"
          bytes=$((bytes + $(wc -c < "$archive")))
          unpack "$archive" "$tmp"
          # Each unpacks to <name>-archive/{bin,lib,include}; merge them into
          # one root, which is what CUDA_PATH has to point at.
          dir="$tmp/$(basename "$rel" | sed 's/\.tar\.xz$//; s/\.zip$//')"
          cp -r "$dir"/* "$root"/
          rm -rf "$archive" "$dir"
        done
        rm -rf "$tmp"

        # nvcc looks for the runtime in `<nvcc>/../lib64` on Linux; the archives
        # ship it as lib, and it is the installer that makes the other name.
        # Without this, cmake's compiler-id link fails on -lcudadevrt.
        if [ "$RUNNER_OS" = 'Linux' ] && [ ! -e "$root/lib64" ]; then
          ln -s lib "$root/lib64"
        fi

        echo "engine toolchain: fetched $((bytes / 1024 / 1024)) MB of CUDA $release in $((SECONDS - sw))s"

        # nvcc is under bin, or bin/x64 on some Windows releases while the DLLs
        # stay in bin. Locate it rather than assume, and put both on PATH.
        nvcc=$(find "$root/bin" -maxdepth 2 \( -name 'nvcc' -o -name 'nvcc.exe' \) | head -1)
        [ -n "$nvcc" ] || { echo "error: no nvcc under $root/bin" >&2; exit 1; }
        "$nvcc" --version

        for lib in cudart cublas cublasLt; do
          find "$root" -name "*$lib*" -print -quit | grep -q . || {
            echo "error: no $lib under $root -- the package list is incomplete" >&2
            exit 1
          }
        done

        {
          echo "CUDA_PATH=$root_native"
          echo "CUDA_HOME=$root_native"
        } >> "$GITHUB_ENV"
        if [ "$RUNNER_OS" = "Windows" ]; then
          printf '%s\\bin\n%s\\bin\\x64\n' "$root_native" "$root_native" >> "$GITHUB_PATH"
        else
          echo "$root/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
        fi
      env:
        VARIANT: ${{ inputs.variant }}

    # Windows builds the engine the way upstream llama.cpp builds this exact
    # configuration: Ninja plus its own clang toolchain file. No developer
    # environment is set up for it -- clang locates the MSVC headers and
    # libraries itself, which an earlier run demonstrated by compiling all of
    # ggml without one. The image carries LLVM; ninja is not dependable.
    - name: Provision the Windows engine toolchain
      if: runner.os == 'Windows'
      shell: bash
      run: |
        if command -v ninja >/dev/null 2>&1; then
          echo "engine toolchain: ninja already on the image"
        else
          choco install ninja -y --no-progress
          echo "C:\ProgramData\chocolatey\bin" >> "$GITHUB_PATH"
        fi
        if command -v clang >/dev/null 2>&1; then
          echo "engine toolchain: clang already on the image"
        elif [ -x "/c/Program Files/LLVM/bin/clang.exe" ]; then
          echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
        else
          choco install llvm -y --no-progress
          echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
        fi


    # nvcc on Windows accepts only cl as its host compiler and finds it on PATH.
    - name: Enter the MSVC developer environment for nvcc
      if: runner.os == 'Windows' && contains(inputs.variant, 'cuda')
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    # Inside a VS developer environment rustc takes link.exe from PATH, and make
    # runs its recipes through Git's sh.exe, whose MSYS runtime prepends its own
    # usr/bin -- where GNU coreutils `link` lives. Pin the linker by full path.
    - name: Pin cargo's linker to MSVC link.exe
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not $env:VCToolsInstallDir) { Write-Host "no VS developer environment; rustc locates link.exe itself"; exit 0 }
        $link = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
        if (-not (Test-Path $link)) { throw "link.exe not found at $link" }
        Add-Content $env:GITHUB_ENV "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$link"

    # Asserts the image, not the steps above: a mis-provisioned runner fails
    # here in seconds instead of five minutes into `make build`.
    # Stats zeroed so the post-build report covers this build only.
    - name: Verify the toolchain
      shell: bash
      run: |
        if command -v ccache >/dev/null 2>&1; then ccache -z; fi
        make check-engine-toolchain
