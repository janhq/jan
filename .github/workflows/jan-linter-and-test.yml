name: Linter & Test
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/jan-linter-and-test.yml
      - '.github/actions/changed-areas/**'
      - '.github/scripts/changed-areas*'
      - 'vitest.config.ts'
      - 'rust-toolchain.toml'
      - 'scripts/stub-tauri-resources.mjs'
      - 'scripts/rust-coverage.sh'
      - 'scripts/download-bin.mjs'
      - 'scripts/build-windows-icon.mjs'
      - 'package.json'
      - 'yarn.lock'
      - 'core/**'
      - 'extensions/**'
      - 'Makefile'
      - 'src-tauri/**'
      - 'web-app/**'
      - 'packages/**'
      - 'extensions-samples/**'
      - 'scripts/extensions-smoke.mjs'

  # No paths filter on pull requests: a workflow a filter skips never reports,
  # so its required ci-ok check would sit pending and block the merge. The
  # changes job does the filtering instead, and a PR that reaches no area runs
  # only that job and ci-ok.
  pull_request:
    branches:
      - main
      - release/**

concurrency:
  group: linter-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base_branch_cov:
    needs: changes
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      && (needs.changes.outputs.ts == 'true' || needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.base_ref }}
      - name: Use Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Install dependencies
        run: |
          make lint

      - name: Run test coverage
        run: |
          yarn test:coverage

      - name: Upload code coverage for ref branch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ref-lcov.info
          path: coverage/lcov.info

  base_branch_rust_cov:
    needs: changes
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.base_ref }}

      - name: Install Tauri dependencies
        run: |
          sudo apt update
          sudo apt install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@9e57365e36de1e26dea5145e57d471261468d9f7 # cargo-llvm-cov

      # This job is the one place two trees meet: the steps are this workflow's,
      # from the PR, but the checkout above is the base branch's. So a step that
      # runs a script out of the repo gets the base tree's copy -- which is the
      # one that does not have whatever the PR just changed. Take the script from
      # the PR head, and put it in `scripts/` rather than running it in place:
      # it resolves the repo root from its own location, so a copy sitting
      # anywhere else would stub that directory instead.
      - name: Check out this PR's stub script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: scripts/stub-tauri-resources.mjs
          sparse-checkout-cone-mode: false
          path: .pr-head

      # Stubs the engine worker and a libggml* as well, which the bundle config
      # requires.
      - name: Create Tauri resource stubs for CI
        run: |
          cp .pr-head/scripts/stub-tauri-resources.mjs scripts/
          node scripts/stub-tauri-resources.mjs

      - name: Run Rust test coverage
        run: |
          cargo llvm-cov clean --workspace --manifest-path src-tauri/Cargo.toml
          cargo llvm-cov --no-report --manifest-path src-tauri/Cargo.toml --no-default-features --features test-tauri -- --test-threads=1
          cargo llvm-cov --no-report --manifest-path src-tauri/plugins/tauri-plugin-hardware/Cargo.toml
          cargo llvm-cov --no-report --manifest-path src-tauri/plugins/tauri-plugin-llamacpp/Cargo.toml
          cargo llvm-cov --no-report --manifest-path src-tauri/utils/Cargo.toml
          cargo llvm-cov report --lcov --output-path rust-lcov.info --manifest-path src-tauri/Cargo.toml

      - name: Upload Rust code coverage for ref branch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ref-rust-lcov.info
          path: rust-lcov.info

  # Classifies the PR's files (.github/scripts/changed-areas.sh); every job
  # below runs only for the areas it tests. Pushes and dispatches run all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.areas.outputs.ts }}
      mlx: ${{ steps.areas.outputs.mlx }}
      rust: ${{ steps.areas.outputs.rust }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: .github
      - id: areas
        uses: ./.github/actions/changed-areas

  # Lint and vitest are platform-independent, so they run once, on Linux. The
  # one exception is the mlx-extension suite, which the next job covers.
  test-ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Getting the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Installing node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Linter and test
        run: make test-ts

  # vitest.config.ts includes extensions/mlx-extension only on macOS: its
  # plugin API resolves nowhere else.
  test-mlx-extension:
    needs: changes
    if: needs.changes.outputs.mlx == 'true'
    runs-on: 'macos-latest'
    steps:
      - name: Getting the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Installing node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Test the mlx extension
        run: |
          make install-and-build
          yarn vitest run --project @janhq/mlx-extension

  # The Rust suites do depend on the platform (the shell sandbox, paths, the
  # Windows resource compiler), so they keep all three.
  test-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    env:
      # No debuginfo in test builds: it is most of the target dir's size (and
      # so of the cache), and a failing test still reports file and line, which
      # come from the panic location rather than debuginfo.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Getting the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install make
        if: runner.os == 'Windows'
        run: choco install --yes --no-progress make

      - name: Installing node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev libfuse2 webkit2gtk-driver

      # The agent-tools unit tests run the shell tool inside its Linux sandbox,
      # bubblewrap, which needs unprivileged user namespaces; Ubuntu 24.04's
      # AppArmor default refuses those.
      - name: Install the shell sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Set up Xcode version
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      # Linux only, and saved only on main: the repo's 10GB cache cap already
      # holds rust-check's caches, and a pull request's own cache is readable
      # by nothing but that pull request, so saving per PR only evicts main's.
      # macOS and Windows build cold; they run only when Rust changed.
      # The workspaces are the five `make test-rust` builds, each its own
      # target dir (the plugins and utils are standalone crates).
      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'Linux'
        with:
          workspaces: |
            src-tauri
            src-tauri/plugins/tauri-plugin-hardware
            src-tauri/plugins/tauri-plugin-llamacpp
            src-tauri/plugins/tauri-plugin-agent-tools
            src-tauri/utils
          shared-key: test-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Rust tests
        if: runner.os == 'Linux'
        run: |
          export DISPLAY=$(w -h | awk 'NR==1 {print $2}')
          make test-ci-rust

      - name: Rust tests
        if: runner.os == 'macOS'
        run: make test-ci-rust
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Rust tests
        if: runner.os == 'Windows'
        shell: powershell
        run: make test-ci-rust

  # End-to-end smoke install of the sample extension bundle: packs it, installs
  # the tarball with the extensions plugin (tests/smoke.rs) and loads it in the
  # web-app's extension host. It crosses both the TypeScript and Rust sides.
  extensions-smoke:
    needs: changes
    if: needs.changes.outputs.ts == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Getting the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Installing node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install Tauri dependencies
        run: |
          sudo apt update
          sudo apt install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Extensions smoke install
        run: |
          make install-and-build
          make test-extensions-smoke

  # The one check to mark required, for the reason given on rust-check's ci-ok:
  # the jobs above report "skipped" when a PR does not reach them.
  ci-ok:
    name: Linter & Test passed
    if: always()
    needs: [changes, test-ts, test-mlx-extension, test-rust, extensions-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Fail on a failed or cancelled job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done

  test-on-windows:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        antivirus-tools: ['mcafee', 'bit-defender']
    runs-on: windows-desktop-${{ matrix.antivirus-tools }}
    steps:
      - name: Getting the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Installing node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # Clean cache, continue on error
      - name: 'Cleanup cache'
        shell: powershell
        continue-on-error: true
        run: |
          $path = "$Env:APPDATA\jan"
          if (Test-Path $path) {
              Remove-Item "\\?\$path" -Recurse -Force
          } else {
              Write-Output "Folder does not exist."
          }
          make clean

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Linter and test
        shell: powershell
        run: |
          make test

  # A PR that touches no Rust skips Rust coverage on both sides, so the
  # comparison stays like for like (TS only); the merge step below already
  # falls back to TS-only when the base Rust report is missing.
  coverage-check:
    if: >-
      !cancelled() && needs.base_branch_cov.result == 'success'
      && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [changes, base_branch_cov, base_branch_rust_cov]
    continue-on-error: true
    steps:
      - name: Getting the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Installing node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Install dependencies
        run: |
          make lint

      - name: Run TypeScript test coverage
        run: |
          yarn test:coverage

      - name: Install Tauri dependencies
        if: needs.changes.outputs.rust == 'true'
        run: |
          sudo apt update
          sudo apt install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - name: Install cargo-llvm-cov
        if: needs.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@9e57365e36de1e26dea5145e57d471261468d9f7 # cargo-llvm-cov

      - name: Run Rust test coverage
        if: needs.changes.outputs.rust == 'true'
        run: ./scripts/rust-coverage.sh

      - name: Merge coverage reports
        run: |
          if [ -f rust-lcov.info ]; then
            cat ./coverage/lcov.info rust-lcov.info > merged-lcov.info
          else
            cp ./coverage/lcov.info merged-lcov.info
          fi

      - name: Download code coverage report from base branch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ref-lcov.info

      - name: Download Rust code coverage report from base branch
        id: download-rust-cov
        if: needs.changes.outputs.rust == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ref-rust-lcov.info
          path: base-rust-cov

      - name: Merge base branch coverage reports
        run: |
          if [ -f ./base-rust-cov/rust-lcov.info ]; then
            cat ./lcov.info ./base-rust-cov/rust-lcov.info > base-merged-lcov.info
          else
            echo "Rust base coverage not available, using TS-only coverage"
            cp ./lcov.info base-merged-lcov.info
          fi

      - name: Generate Code Coverage report
        id: code-coverage
        uses: barecheck/code-coverage-action@d92cdaec187f89f0886ccec37acf11e2a6a85f70 # v1.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: './merged-lcov.info'
          base-lcov-file: './base-merged-lcov.info'
          send-summary-comment: true
          show-annotations: 'warning'
