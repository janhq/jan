name: Jan Docs

# Builds docs/ (Fumadocs, static export) and deploys it to the Cloudflare Pages
# project behind docs.jan.ai.
#
# IMPORTANT: this deploys to `jan-docs` (docs.jan.ai) ONLY. The old `docs`
# project serves jan.ai and is now deployed from janhq/jan.ai (#434); never
# point this workflow at it, or jan.ai's marketing site is replaced by the docs.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/jan-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/jan-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jan-docs-${{ github.ref }}
  # Cancel superseded PR previews; leave production deploys alone.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: Build and deploy docs.jan.ai
    env:
      CLOUDFLARE_PROJECT_NAME: jan-docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate

      # docs/ is its own Yarn project with a committed docs/yarn.lock;
      # --immutable fails the job if it is out of date.
      - name: Install dependencies
        run: yarn install --immutable

      # Only the variables the build reads; nothing else from `secrets`.
      - name: Build
        env:
          NODE_ENV: production
          GTM_ID: ${{ secrets.GTM_ID }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          node scripts/build-redirects.mjs --check
          yarn build

      - name: Check redirects
        run: node scripts/check-redirects.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-out
          path: docs/out
          retention-days: 3

      # PR number, not head_ref: branch names are attacker-controlled and this
      # value is interpolated into a shell command.
      - name: Publish PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: deployPreview
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4"
          command: pages deploy ./docs/out --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=pr-${{ github.event.pull_request.number }}

      - uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2
        if: steps.deployPreview.outputs.deployment-url != ''
        with:
          message: |
              Docs preview: ${{ steps.deployPreview.outputs.deployment-url }}

      - name: Publish to production (docs.jan.ai)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4"
          command: pages deploy ./docs/out --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=main
