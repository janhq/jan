name: Tauri Builder - Nightly / External PRs

on:
  pull_request:
    # Desktop builds run on a pull request only while it carries the
    # `ci:build` label (36-50 min across four platforms). `labeled` makes adding
    # the label start a build; with the label on, every push rebuilds. Adding
    # any other label builds nothing (the job conditions check which label).
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
    paths:
      - '.github/workflows/jan-tauri-build-nightly-external.yaml'
      - '.github/workflows/template-tauri-build-*-external.yml'
      - 'src-tauri/**'
      - 'core/**'
      - 'web-app/**'
      - 'extensions/**'
      - 'scripts/**'
      - 'Makefile'
      - 'package.json'

concurrency:
  # Adding some other label to a PR that carries `ci:build` fires `labeled`
  # too. That run builds nothing, so it gets a group of its own rather than
  # cancelling the build in progress.
  group: nightly-external-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci:build' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  get-update-version:
    if: github.event.pull_request.head.repo.full_name != github.repository && contains(github.event.pull_request.labels.*.name, 'ci:build') && (github.event.action != 'labeled' || github.event.label.name == 'ci:build')
    uses: ./.github/workflows/template-get-update-version.yml

  build-macos:
    if: github.event.pull_request.head.repo.full_name != github.repository && contains(github.event.pull_request.labels.*.name, 'ci:build') && (github.event.action != 'labeled' || github.event.label.name == 'ci:build')
    uses: ./.github/workflows/template-tauri-build-macos-external.yml
    needs: [get-update-version]
    with:
      ref: ${{ github.ref }}
      new_version: ${{ needs.get-update-version.outputs.new_version }}
      channel: nightly

  build-windows-x64:
    if: github.event.pull_request.head.repo.full_name != github.repository && contains(github.event.pull_request.labels.*.name, 'ci:build') && (github.event.action != 'labeled' || github.event.label.name == 'ci:build')
    uses: ./.github/workflows/template-tauri-build-windows-x64-external.yml
    needs: [get-update-version]
    with:
      ref: ${{ github.ref }}
      new_version: ${{ needs.get-update-version.outputs.new_version }}
      channel: nightly

  build-linux-x64:
    if: github.event.pull_request.head.repo.full_name != github.repository && contains(github.event.pull_request.labels.*.name, 'ci:build') && (github.event.action != 'labeled' || github.event.label.name == 'ci:build')
    uses: ./.github/workflows/template-tauri-build-linux-x64-external.yml
    needs: [get-update-version]
    with:
      ref: ${{ github.ref }}
      new_version: ${{ needs.get-update-version.outputs.new_version }}
      channel: nightly
      disable_updater: false