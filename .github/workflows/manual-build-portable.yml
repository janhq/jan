name: Manual build portable (windows)

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: "Code ref to build (leave empty to use the selected branch)"
        required: false
        default: ""
      version:
        description: "Version to stamp into the app"
        required: true
        default: "0.8.5"
      channel:
        description: "Release channel"
        type: choice
        options: [stable, beta, nightly]
        required: true
        default: "stable"

jobs:
  build-windows-portable:
    uses: ./.github/workflows/template-tauri-build-windows-x64.yml
    secrets: inherit
    with:
      ref: ${{ inputs.build_ref || github.ref }}
      public_provider: "none"
      channel: ${{ inputs.channel }}
      new_version: ${{ inputs.version }}
      upload_url: ""
