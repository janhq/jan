# Builds the Jan Agent CLI binary for macOS (universal binary via lipo).
# Produces a single stripped tarball; no Tauri bundler, no frontend.
name: cli-build-macos
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
        default: refs/heads/dev
      new_version:
        required: true
        type: string
        default: ''
      channel:
        required: true
        type: string
        default: agent-nightly
    secrets:
      DELTA_AWS_S3_BUCKET_NAME:
        required: false
      DELTA_AWS_ACCESS_KEY_ID:
        required: false
      DELTA_AWS_SECRET_ACCESS_KEY:
        required: false
      DELTA_AWS_REGION:
        required: false
      # Optional code signing
      CODE_SIGN_P12_BASE64:
        required: false
      CODE_SIGN_P12_PASSWORD:
        required: false
      NOTARIZE_P8_BASE64:
        required: false
      NOTARY_ISSUER:
        required: false
      NOTARY_KEY_ID:
        required: false
    outputs:
      FILE_NAME:
        value: ${{ jobs.build-macos.outputs.FILE_NAME }}
      SHA256:
        value: ${{ jobs.build-macos.outputs.SHA256 }}

jobs:
  build-macos:
    runs-on: macos-latest
    outputs:
      FILE_NAME: ${{ steps.package.outputs.FILE_NAME }}
      SHA256: ${{ steps.package.outputs.SHA256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CLI binary (x86_64)
        env:
          JAN_CLI_UPDATE_CHANNEL: ${{ inputs.channel }}
          JAN_CLI_BUILD_VERSION: ${{ inputs.new_version }}
        run: |
          cd src-tauri
          cargo build --no-default-features --features cli --bin jan --release --target x86_64-apple-darwin

      - name: Build CLI binary (aarch64)
        env:
          JAN_CLI_UPDATE_CHANNEL: ${{ inputs.channel }}
          JAN_CLI_BUILD_VERSION: ${{ inputs.new_version }}
        run: |
          cd src-tauri
          cargo build --no-default-features --features cli --bin jan --release --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p universal
          lipo -create \
            src-tauri/target/x86_64-apple-darwin/release/jan \
            src-tauri/target/aarch64-apple-darwin/release/jan \
            -output universal/jan

      - name: Strip universal binary
        run: strip universal/jan

      - name: Check secrets configured
        id: secrets-check
        run: |
          echo "has-cert=${{ secrets.CODE_SIGN_P12_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      - name: Get key for notarize
        run: base64 -d <<< "$NOTARIZE_P8_BASE64" > /tmp/notary-key.p8
        shell: bash
        env:
          NOTARIZE_P8_BASE64: ${{ secrets.NOTARIZE_P8_BASE64 }}

      - uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2
        if: steps.secrets-check.outputs.has-cert == 'true'
        continue-on-error: true
        with:
          p12-file-base64: ${{ secrets.CODE_SIGN_P12_BASE64 }}
          p12-password: ${{ secrets.CODE_SIGN_P12_PASSWORD }}

      - name: Code sign (if certs configured)
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.CODE_SIGN_P12_BASE64 }}" ]; then
            # --options runtime is required: notarization rejects binaries
            # without the hardened runtime enabled.
            codesign --force --sign "Developer ID Application" universal/jan \
              --options runtime --timestamp
          else
            echo "No signing cert configured; skipping code sign."
          fi

      - name: Package tarball
        id: package
        run: |
          VERSION="${{ inputs.new_version }}"
          FILE_NAME="jan-agent-darwin-universal-$VERSION.tar.gz"
          tar czf "$FILE_NAME" -C universal jan
          echo "FILE_NAME=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "SHA256=$(shasum -a 256 "$FILE_NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Notarize (if configured)
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.NOTARY_ISSUER }}" ]; then
            # notarytool rejects .tar.gz outright (zip/pkg/dmg only), so submit a
            # zip; the distributed artifact stays the tarball. ditto is Apple's
            # documented way to package a command line tool for notarization.
            NOTARIZE_ZIP="jan-agent-darwin-universal-notarize.zip"
            ditto -c -k universal/jan "$NOTARIZE_ZIP"
            xcrun notarytool submit "$NOTARIZE_ZIP" \
              --key /tmp/notary-key.p8 \
              --key-id "${{ secrets.NOTARY_KEY_ID }}" \
              --issuer "${{ secrets.NOTARY_ISSUER }}" \
              --wait
          else
            echo "No notary key configured; skipping notarization."
          fi

      - name: Upload to S3
        run: |
          aws s3 cp "./${{ steps.package.outputs.FILE_NAME }}" \
            "s3://${{ secrets.DELTA_AWS_S3_BUCKET_NAME }}/${{ inputs.channel }}/${{ steps.package.outputs.FILE_NAME }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DELTA_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DELTA_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.DELTA_AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
