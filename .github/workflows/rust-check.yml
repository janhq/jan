name: Rust Check
on:
  workflow_dispatch:
  # Caches are branch-scoped and only the default branch's are readable from
  # anywhere, so main has to run this to leave anything worth restoring.
  push:
    branches:
      - main
  pull_request:
    # PRs open against main; the dev-only filter left this to manual dispatch.
    branches:
      - main
      - dev
    # No paths filter: a workflow a filter skips never reports, so the required
    # ci-ok check would sit pending and block the merge. The changes job skips
    # the jobs a PR cannot affect instead (docs, top-level markdown, templates).

concurrency:
  group: rust-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debuginfo: it is most of a debug target dir, and so of every cache
  # below, against the repo's 10GB cap. Failing tests still report file and
  # line (from the panic location, not debuginfo). rust-cache hashes CARGO*
  # variables into its key, so this starts one fresh, smaller set on main.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # Classifies the PR's files (.github/scripts/changed-areas.sh) so each job
  # below runs only when something it compiles changed. Pushes, dispatches and
  # an unreadable file list run everything.
  changes:
    name: changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      cli: ${{ steps.areas.outputs.cli }}
      jan_cli: ${{ steps.areas.outputs.jan_cli }}
      adk: ${{ steps.areas.outputs.adk }}
      app: ${{ steps.areas.outputs.app }}
      crates: ${{ steps.areas.outputs.crates }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: .github
      - id: areas
        uses: ./.github/actions/changed-areas
      - name: Self-test the classifier
        run: bash .github/scripts/changed-areas.test.sh

  # The desktop and CLI feature sets are mutually exclusive configs of the same
  # crate, so neither one alone proves the other compiles. A change reaching
  # only desktop code (a desktop-only plugin) skips the cli config, and one
  # reaching only the cli surface (protocol/) skips the two desktop ones; any
  # change to app_lib itself runs all three.
  app:
    name: app (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.app != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The configs' properties are looked up by name below rather than
        # listed under `include`: an include entry naming a config the
        # classifier left out would add that config back as a new job.
        name: ${{ fromJSON(needs.changes.outputs.app) }}
    env:
      # desktop: the app as it ships.
      # cli: --all-targets matters here: modules like core::agent::global_config
      #   are #[cfg(feature = "cli")], so their tests exist in no other config
      #   and --lib --bins would leave them unlinted.
      # e2e: the e2e feature gates the embedded WebDriver server and turns off
      #   single-instance. No other config compiles that code, so without this
      #   the cfg block silently bit-rots. This only type-checks the gate; it
      #   does not run the e2e suite.
      FEATURES: ${{ fromJSON('{"desktop":"test-tauri","cli":"cli","e2e":"test-tauri,e2e"}')[matrix.name] }}
      TAURI: ${{ matrix.name != 'cli' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
          # Branches restore but never save: one 3.5GB cache set on main
          # rather than one per branch, which is what breached the 10GB cap.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Tauri dependencies
        if: env.TAURI == 'true'
        run: |
          sudo apt update
          sudo apt install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - name: Create Tauri resource stubs
        if: env.TAURI == 'true'
        run: node scripts/stub-tauri-resources.mjs

      - name: cargo check
        run: |
          cargo check --locked --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features "$FEATURES" --all-targets

      - name: cargo clippy
        run: |
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features "$FEATURES" --all-targets \
            -- -D warnings

  # `cargo check` and `clippy --all-targets` compile the tests but never run
  # them, so a unit test that fails at runtime ships green. The CLI config is
  # the one this job runs: it compiles the whole `core::agent` loop and its
  # composers (the tests live in the lib, not behind the desktop features), and
  # it needs neither the Tauri system libraries nor the resource stubs. The
  # byte-level prompt-prefix contract in `core::agent::prefix_stability` is
  # among these tests.
  test:
    name: cargo test (cli)
    needs: changes
    if: needs.changes.outputs.jan_cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # One cache for the three jobs that build the jan binary in the cli
          # feature set (this one, schema, adk): their target dirs are the same
          # debug build, so separate keys stored it three times. Only this job,
          # which builds the most of it, saves.
          shared-key: jan-cli
          # Branches restore but never save: one cache set on main rather than
          # one per branch, which is what breached the 10GB cap.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The plugin-install tests build fixture repositories and commit in
      # them; a runner has no git identity of its own.
      - name: Configure a git identity for the fixture repositories
        run: |
          git config --global user.email "ci@jan.ai"
          git config --global user.name "Jan CI"

      # The Linux shell sandbox, which the agent tests reach.
      - name: Install the shell sandbox
        run: |
          sudo apt update
          sudo apt install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # One thread: a few tests set process-wide state (env vars, the global
      # config), and the same convention is what `make test-rust` uses. A
      # change that reaches only jan-cli or the ADK examples skips it.
      - name: cargo test
        if: needs.changes.outputs.cli == 'true'
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features cli --lib -- --test-threads=1

      # The standalone CLI is not a workspace member, so the command above never
      # reaches it. This is its whole suite (`make check-cli`): the binary-level
      # RPC and ACP tests, stream-json, the TUI, telemetry, and adk_examples,
      # which runs the ADK cookbook's source with the runner's own node and
      # python3 and checks every docs excerpt still matches the file it quotes.
      - name: cargo test (jan-cli)
        run: make check-cli

  # `jan --version` on a build without JAN_CLI_BUILD_VERSION reports the
  # committed app version, so a bump that skips jan-cli or tauri.conf.json
  # ships a CLI naming the wrong release (janhq/jan-internal#454), and so does
  # a tree whose manifests agree but lag the last tag (0.8.5 through v0.8.8).
  # Release builds restamp all of them through the same script; this keeps the
  # committed tree honest for source builds. jq and git ls-remote, no toolchain.
  #
  # Disagreement always fails. A lag behind the latest tag fails only when the
  # change under test changes one of those version values (the script compares
  # them against --base), and is a warning otherwise: a tag is pushed before
  # its bump is committed, and that window must not turn main and every
  # unrelated open PR red, including one that only adds a dependency.
  versions:
    name: manifest versions agree and are released
    runs-on: ubuntu-latest
    steps:
      # A PR's checkout is the merge commit, so depth 2 brings its first
      # parent, the base tip it merges into.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      # Reading the manifests at the base needs no history between it and
      # HEAD, so a push only has to fetch its `before` commit. With no usable range (a new branch, a force
      # push whose old tip is gone, a manual dispatch) lag stays a warning.
      - name: Compare the app, CLI and Tauri manifest versions
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          case "$EVENT" in
            pull_request) base="$(git rev-parse HEAD^1)" ;;
            push)
              if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] &&
                git fetch --quiet --depth=1 origin "$BEFORE"; then
                base="$BEFORE"
              fi
              ;;
          esac
          if [ -n "$base" ]; then
            bash .github/scripts/stamp-version.sh --check --base "$base"
          else
            echo "no diff range for this $EVENT event; a lag behind the latest tag is a warning"
            bash .github/scripts/stamp-version.sh --check
          fi

  # The deliverable of the schema work is this guard, not the file: a protocol
  # shape that changes without regenerating leaves every consumer validating
  # against a document that no longer describes the channel. The unit test in
  # core::cli::protocol_schema compares the types against the file; this runs the
  # command a human would, in the CLI's own feature set, and prints the diff.
  schema:
    name: protocol schema
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Restores the `test` job's cache; see the note there.
          shared-key: jan-cli
          save-if: false

      # --locked: the generated document is a function of the locked schemars,
      # so the only thing that may move it is a commit.
      - name: Regenerate the protocol schema
        run: |
          cd src-tauri/jan-cli
          cargo run --quiet --locked --no-default-features --features cli \
            --bin jan -- cli agent schema --out ../../protocol/schema.json

      # The RPC artifact is the same kind of file for the other surface, and its
      # guard lives in this job rather than its own: one build, one cache, and
      # the two documents are regenerated by the same binary.
      - name: Regenerate the RPC schema
        run: |
          cd src-tauri/jan-cli
          cargo run --quiet --locked --no-default-features --features cli \
            --bin jan -- cli agent rpc-schema --out ../../protocol/rpc-schema.json

      - name: Fail on drift
        run: |
          if git diff --exit-code -- protocol/schema.json protocol/rpc-schema.json; then
            echo "protocol/schema.json and protocol/rpc-schema.json match the types"
            exit 0
          fi
          echo "::error title=protocol drift::a committed protocol schema no longer matches its types"
          {
            echo "## protocol drift"
            echo
            echo '```diff'
            git diff -- protocol/schema.json protocol/rpc-schema.json
            echo '```'
            echo
            echo 'Run `make protocol-schema` / `make protocol-rpc-schema` and commit the result.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # Each plugin and src-tauri/utils is its own workspace, so checking the app
  # crate compiles them as path dependencies but never lints them. No --locked
  # here: Cargo.lock is gitignored and only some of these crates commit one.
  #
  # jan-cli is standalone the same way, but depends on app_lib rather than the
  # reverse, so the app matrix never reaches it either. Its include entry adds
  # what it differs by: it commits a Cargo.lock (so --locked), it only builds
  # with the cli feature, that feature is Tauri-free (no system libraries), and
  # its .cargo/config.toml puts the target dir at src-tauri/target.
  #
  # The crate list comes from the classifier: a crate is linted when it or a
  # path dependency of it changed. tauri-plugin-mlx is Apple-Silicon-only and
  # a macOS target dependency, not part of any Linux build, so it has no entry.
  crates:
    name: ${{ matrix.crate }}
    needs: changes
    if: needs.changes.outputs.crates != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.changes.outputs.crates) }}
    # jan-cli's differences are keyed on its name, not an `include` entry, for
    # the reason given on the app matrix.
    env:
      FLAGS: ${{ matrix.crate == 'jan-cli' && '--locked --no-default-features --features cli' || '' }}
      TARGET_DIR: ${{ matrix.crate == 'jan-cli' && '../target' || 'target' }}
      SKIP_TAURI: ${{ matrix.crate == 'jan-cli' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/${{ matrix.crate }} -> ${{ env.TARGET_DIR }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Tauri dependencies
        if: env.SKIP_TAURI != 'true'
        run: |
          sudo apt update
          sudo apt install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - name: cargo check
        run: cargo check $FLAGS --manifest-path src-tauri/${{ matrix.crate }}/Cargo.toml --all-targets

      - name: cargo clippy
        run: cargo clippy $FLAGS --manifest-path src-tauri/${{ matrix.crate }}/Cargo.toml --all-targets -- -D warnings

  # The ADKs are clients of the same channel the CLI tests drive, so they are
  # built and run here rather than in the linter workflow: the subject is a real
  # runtime binary, and a client that only agreed with itself would pass. The
  # committed wire types are checked against protocol/rpc-schema.json in the
  # same job, since that document is what generates them.
  adk:
    name: ADKs
    needs: changes
    if: needs.changes.outputs.adk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Restores the `test` job's cache; see the note there.
          shared-key: jan-cli
          save-if: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.x'

      # The runtime the ADKs drive, built the way a user builds it.
      - name: Build the jan runtime
        run: |
          cargo build --locked --manifest-path src-tauri/jan-cli/Cargo.toml \
            --no-default-features --features cli --bin jan
          echo "JAN_BIN=$PWD/src-tauri/jan-cli/target/debug/jan" >> "$GITHUB_ENV"

      # For the ADK's own type-check. The suite itself needs no dependency: the
      # package has none, and `node --test` is in the runtime.
      - name: Install the workspace
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn install --immutable

      - name: Type-check the JavaScript ADK
        run: yarn workspace @janhq/adk check-types

      - name: JavaScript ADK suite
        run: yarn workspace @janhq/adk test

      # The Python client reaches the runtime without Node, so it runs with a
      # PATH that has no node on it: the claim is checked, not stated.
      - name: Python ADK suite
        run: |
          env -i PATH="$(dirname "$JAN_BIN"):/usr/bin:/bin" HOME="$HOME" \
            JAN_BIN="$JAN_BIN" python3 -m unittest discover -s adk/python/tests -t adk/python

  # The one check to mark required. Path-gated jobs report "skipped" when a PR
  # does not reach them, and a required check that never reports blocks the
  # merge; this job always reports, and fails only on a real failure or
  # cancellation among the jobs it waits for.
  ci-ok:
    name: Rust Check passed
    if: always()
    needs: [changes, app, test, versions, schema, crates, adk]
    runs-on: ubuntu-latest
    steps:
      - name: Fail on a failed or cancelled job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
