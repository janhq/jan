name: Rust Check
on:
  workflow_dispatch:
  # Caches are branch-scoped and only the default branch's are readable from
  # anywhere, so main has to run this to leave anything worth restoring.
  push:
    branches:
      - main
  pull_request:
    # PRs open against main; the dev-only filter left this to manual dispatch.
    branches:
      - main
      - dev

concurrency:
  group: rust-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The desktop and CLI feature sets are mutually exclusive configs of the same
  # crate, so neither one alone proves the other compiles.
  app:
    name: app (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop
            features: test-tauri
            targets: --all-targets
            tauri: true
          # --all-targets matters here: modules like core::agent::global_config
          # are #[cfg(feature = "cli")], so their tests exist in no other config
          # and --lib --bins would leave them unlinted.
          - name: cli
            features: cli
            targets: --all-targets
            tauri: false
          # The e2e feature gates the embedded WebDriver server and turns off
          # single-instance. No other matrix entry compiles that code, so
          # without this the cfg block silently bit-rots. This only type-checks
          # the gate; it does not run the e2e suite.
          - name: e2e
            features: test-tauri,e2e
            targets: --all-targets
            tauri: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
          # Branches restore but never save: one 3.5GB cache set on main
          # rather than one per branch, which is what breached the 10GB cap.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Tauri dependencies
        if: matrix.tauri
        run: |
          sudo apt update
          sudo apt install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - name: Create Tauri resource stubs
        if: matrix.tauri
        run: node scripts/stub-tauri-resources.mjs

      - name: cargo check
        run: |
          cargo check --locked --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features ${{ matrix.features }} ${{ matrix.targets }}

      - name: cargo clippy
        run: |
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features ${{ matrix.features }} ${{ matrix.targets }} \
            -- -D warnings

  # `cargo check` and `clippy --all-targets` compile the tests but never run
  # them, so a unit test that fails at runtime ships green. The CLI config is
  # the one this job runs: it compiles the whole `core::agent` loop and its
  # composers (the tests live in the lib, not behind the desktop features), and
  # it needs neither the Tauri system libraries nor the resource stubs. The
  # byte-level prompt-prefix contract in `core::agent::prefix_stability` is
  # among these tests.
  test:
    name: cargo test (cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: test-cli
          # Branches restore but never save: one 3.5GB cache set on main
          # rather than one per branch, which is what breached the 10GB cap.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The plugin-install tests build fixture repositories and commit in
      # them; a runner has no git identity of its own.
      - name: Configure a git identity for the fixture repositories
        run: |
          git config --global user.email "ci@jan.ai"
          git config --global user.name "Jan CI"

      # One thread: a few tests set process-wide state (env vars, the global
      # config), and the same convention is what `make test-rust` uses.
      - name: cargo test
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features cli --lib -- --test-threads=1

  # The deliverable of the schema work is this guard, not the file: a protocol
  # shape that changes without regenerating leaves every consumer validating
  # against a document that no longer describes the channel. The unit test in
  # core::cli::protocol_schema compares the types against the file; this runs the
  # command a human would, in the CLI's own feature set, and prints the diff.
  schema:
    name: protocol schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: protocol-schema
          # Branches restore but never save: one 3.5GB cache set on main
          # rather than one per branch, which is what breached the 10GB cap.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --locked: the generated document is a function of the locked schemars,
      # so the only thing that may move it is a commit.
      - name: Regenerate the protocol schema
        run: |
          cd src-tauri/jan-cli
          cargo run --quiet --locked --no-default-features --features cli \
            --bin jan -- cli agent schema --out ../../protocol/schema.json

      # The RPC artifact is the same kind of file for the other surface, and its
      # guard lives in this job rather than its own: one build, one cache, and
      # the two documents are regenerated by the same binary.
      - name: Regenerate the RPC schema
        run: |
          cd src-tauri/jan-cli
          cargo run --quiet --locked --no-default-features --features cli \
            --bin jan -- cli agent rpc-schema --out ../../protocol/rpc-schema.json

      - name: Fail on drift
        run: |
          if git diff --exit-code -- protocol/schema.json protocol/rpc-schema.json; then
            echo "protocol/schema.json and protocol/rpc-schema.json match the types"
            exit 0
          fi
          echo "::error title=protocol drift::a committed protocol schema no longer matches its types"
          {
            echo "## protocol drift"
            echo
            echo '```diff'
            git diff -- protocol/schema.json protocol/rpc-schema.json
            echo '```'
            echo
            echo 'Run `make protocol-schema` / `make protocol-rpc-schema` and commit the result.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # Each plugin and src-tauri/utils is its own workspace, so checking the app
  # crate compiles them as path dependencies but never lints them. No --locked
  # here: Cargo.lock is gitignored and only some of these crates commit one.
  crates:
    name: ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # tauri-plugin-mlx is Apple-Silicon-only and is a macOS target
        # dependency, not part of any Linux build.
        crate:
          - plugins/tauri-plugin-agent-tools
          - plugins/tauri-plugin-hardware
          - plugins/tauri-plugin-llamacpp
          - plugins/tauri-plugin-rag
          - plugins/tauri-plugin-vector-db
          - plugins/tauri-plugin-websearch
          - utils
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/${{ matrix.crate }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Tauri dependencies
        run: |
          sudo apt update
          sudo apt install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - name: cargo check
        run: cargo check --manifest-path src-tauri/${{ matrix.crate }}/Cargo.toml --all-targets

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/${{ matrix.crate }}/Cargo.toml --all-targets -- -D warnings
